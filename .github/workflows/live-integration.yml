name: Live integration (nightly)

# Hits the REAL upstream services (Ensembl Plants, UniProt, Europe PMC,
# STRING-db, OpenTimestamps). Kept OFF the PR path so pull-request CI stays fast
# and network-free — this catches upstream outages and format regressions on a
# schedule instead. Also runnable on demand via the Actions "Run workflow" button.

on:
  schedule:
    - cron: "17 6 * * *" # 06:17 UTC daily
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run live-integration smoke tests
        env:
          CULTIVARS_LIVE_TESTS: "1"
        run: pytest tests/test_live_integration.py -v

      # One open issue per run of failures: open it the first night, comment on
      # it each night after, so a week of failures is one issue, not seven.
      - name: Open or update the failure issue
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$(gh api "repos/$GH_REPO" --jq .has_issues)" != "true" ]; then
            echo "Issues are turned off for this repository, so no issue was opened." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          title="Nightly live-integration tests failing"
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number,title \
            --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "Failed again on $(date -u +%F). Run: $RUN_URL"
          else
            gh issue create --title "$title" --body "The nightly live-integration run failed on $(date -u +%F). Run: $RUN_URL

          Later failures are added here as comments. Close this issue once the tests pass again."
          fi

name: Live integration (nightly)

# Hits the REAL upstream services (Ensembl Plants, UniProt, Europe PMC,
# STRING-db, OpenTimestamps). Kept OFF the PR path so pull-request CI stays fast
# and network-free — this catches upstream outages and format regressions on a
# schedule instead. Also runnable on demand via the Actions "Run workflow" button.

on:
  schedule:
    - cron: "17 6 * * *" # 06:17 UTC daily
  workflow_dispatch: {}

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run live-integration smoke tests
        env:
          CULTIVARS_LIVE_TESTS: "1"
        run: pytest tests/test_live_integration.py -v

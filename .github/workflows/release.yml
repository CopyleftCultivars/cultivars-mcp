name: Release

# Runs when a maintainer pushes a tag like v0.2.0. Builds the wheel and sdist,
# publishes them to PyPI by trusted publishing (no token is stored anywhere),
# then creates the GitHub release from the matching CHANGELOG section.
# See RELEASING.md for the one-time PyPI setup and the full steps.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check versions and extract release notes
        run: python scripts/release_check.py "${GITHUB_REF_NAME}" --notes release-notes.md

      - name: Run the tests
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pytest tests/ -q

      - name: Build
        run: |
          pip install build
          python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/
            release-notes.md

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/cultivars-mcp
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist

      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --title "${GITHUB_REF_NAME}" --notes-file release-notes.md

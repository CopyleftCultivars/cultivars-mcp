[project]
name = "cultivars-mcp"
version = "0.1.0"
description = "MCP server for plant genomics research — gene lookup, variant effect prediction, orthology, sequence retrieval, and a curated atlas of natural-farming-relevant gene families via the Ensembl Plants REST API. Part of the Copyleft Cultivars ecosystem."
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.0.0,<2",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "cryptography>=42.0",
]

[project.scripts]
cultivars-mcp = "server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
# Reference OpenTimestamps client — only needed to `ots upgrade` / `ots verify`
# a proof against the Bitcoin blockchain. Creating and structurally verifying
# proofs works with the core httpx dependency alone.
anchor = [
    "opentimestamps-client>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# server.py is a single top-level module. It reads atlas_evidence.json and
# WANTED_TRAITS.yaml from its own directory at runtime, so they ship beside it.
only-include = ["server.py", "atlas_evidence.json", "WANTED_TRAITS.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
